spring:
  application:
    name: user-service
  config:
    import: optional:configserver:http://config-server:8888/
  mvc:
    async:
      request-timeout: -1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true